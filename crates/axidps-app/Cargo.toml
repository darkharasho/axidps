[package]
name = "axidps-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ctrlc = { version = "3.5.3", features = ["termination"] }
axidps-protocol = { path = "../axidps-protocol" }
base64 = "0.22"
axidps-plugins = { path = "../axidps-plugins" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"
semver = "1"
regex = "1"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_Shell", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Console", "Win32_System_JobObjects", "Win32_Security", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip"] }
rfd = { version = "0.15", default-features = false }
tray-icon = { version = "0.19", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "6"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "axidps"
path = "src/main.rs"
