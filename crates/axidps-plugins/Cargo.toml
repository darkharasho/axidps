[package]
name = "axidps-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "axidps plugin manifests, folder scan, path resolution, CSP and change watching (no Servo)"

[dependencies]
serde_json = "1"
semver = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"
getrandom = "0.3"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
