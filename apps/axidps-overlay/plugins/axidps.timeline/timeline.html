<!doctype html>
<!-- Timeline: squad damage per second over the fight, dealt and taken. -->
<html>
<head>
<meta charset="utf-8">
<script src="/_sdk/axidps.js"></script>
<style>
  canvas { display: block; }
  .foot { height: 22px; padding: 0 12px; color: var(--faint); display: flex; justify-content: space-between;
    border-top: 1px solid var(--line); font-size: 11px; align-items: center; }
  .foot span { white-space: nowrap; overflow: hidden; }
  body.compact .foot { height: 16px; padding: 0 8px; font-size: 9.5px; }
  .good { color: var(--good); } .bad { color: var(--bad); }
</style>
</head>
<body>
<canvas width="420" height="150"></canvas>
<div class="foot"><span><b class="good">dealt</b> · <b class="bad">taken</b> per second</span><span class="peak"></span></div>
<script src="timeline.js"></script>
</body>
</html>
