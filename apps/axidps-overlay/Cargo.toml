[package]
name = "axidps-overlay"
version = "0.1.0"
edition = "2024"
description = "axidps overlay host: Servo renders the in-game UI offscreen and publishes frames to the game through /dev/shm"
license = "MIT"
publish = false

# Standalone: pins the same Servo rev and toolchain as Rustron so its build cache is reused.
[workspace]

[dependencies]
anyhow = "1"
axidps-protocol = { path = "../../crates/axidps-protocol" }
axidps-overlay-shm = { path = "../../crates/axidps-overlay-shm" }
axidps-plugins = { path = "../../crates/axidps-plugins" }
# Same version Servo uses, for its `WebResourceRequest::destination` type.
content-security-policy = "=0.9.0"
serde_json = "1"
euclid = "0.22"
getrandom = "0.3"
http = "1"
memmap2 = "0.9"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
servo = { git = "https://github.com/servo/servo", rev = "75d20deef", default-features = false, features = ["bundled", "js_jit", "devtools"] }
url = "2"
winit = "0.30.13"

[profile.release]
debug = false

[dev-dependencies]
tempfile = "3"
