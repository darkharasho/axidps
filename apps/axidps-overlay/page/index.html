<!doctype html>
<!-- axidps in-game UI. The host renders this page offscreen into a 2048x2048 atlas; ui.js lays
     every open window out side by side in it and reports each window's rect, screen position,
     corner radius, blur and flags to the host (console.log "axidps:<token>:{...}", the token from the URL fragment). The DLL draws each
     window's atlas rect at its screen position. The canvas is transparent (the host sets Servo's
     background to clear), so pixels keep their alpha: see-through backgrounds and rounded corners
     reach the game, and the DLL blurs what is behind a window when asked. Windows move only in
     edit mode (Arrange). Host -> page calls: axidps.update(live), restore(saved), screen(w, h),
     edit(on), moved(name, x, y), legacy(x, y), dismiss(), plugins(list). -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "IBM Plex Sans"; src: url(fonts/IBMPlexSans-Regular.ttf); font-weight: 400; }
  @font-face { font-family: "IBM Plex Sans"; src: url(fonts/IBMPlexSans-SemiBold.ttf); font-weight: 600 700; }
  @font-face { font-family: "Fira Code"; src: url(fonts/FiraCode-Regular.ttf); font-weight: 400; }
  @font-face { font-family: "Fira Code"; src: url(fonts/FiraCode-SemiBold.ttf); font-weight: 600 700; }
  @font-face { font-family: "Lato"; src: url(fonts/Lato-Regular.ttf); font-weight: 400; }
  @font-face { font-family: "Lato"; src: url(fonts/Lato-Bold.ttf); font-weight: 600 700; }
  /* Every colour, and the shape and type, is a theme token: ui.js THEMES sets them on :root
     (the values here are Midnight, used until the script runs). */
  :root { --bg: #12151b; --bar: #12151b; --raise: #1a1e26; --raise-hi: #222833; --btn: #232a35;
    --btn-hi: #2e3746; --line: #242a34; --line-hi: #343c49; --text: #e8eaee; --title: #f2f4f7;
    --dim: #8d96a5; --faint: #646d7a; --accent: #7aa2f7; --accent-hi: #a9c1ff; --accent-line: #34456a;
    --accent-soft: rgba(122,162,247,.13); --good: #9ece6a; --bad: #f7768e; --tip: #0b0d11;
    --font: "IBM Plex Sans", system-ui, sans-serif; --fs: 12px; --r: 10px; --rs: 6px; --bw: 1px;
    --rh: 21px; --bh: 32px; }
  * { user-select: none; -webkit-user-select: none; cursor: default; box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden;
    color: var(--text); font: var(--fs)/1.3 var(--font); }
  #atlas { width: 2048px; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 4px; }
  b, strong { font-weight: 600; }

  /* ---- windows ---- */
  .win { background: var(--bg); border: var(--bw) solid var(--line); position: relative; flex: none;
    border-radius: var(--r); overflow: hidden; }
  .win.closed { display: none; }
  /* A plugin window's body: its sandboxed frame, sized by what the plugin reports. */
  .win iframe.plugin { display: block; border: 0; background: transparent; }
  body.editing .win iframe.plugin { pointer-events: none; }
  .tip { position: absolute; display: none; padding: 3px 8px; background: var(--tip); color: var(--text);
    border: 1px solid var(--line-hi); border-radius: var(--rs); white-space: pre; pointer-events: none;
    font-size: 11px; z-index: 10; }
  .bar { height: var(--bh); display: flex; align-items: center; padding: 0 6px 0 12px; gap: 8px;
    background: var(--bar); border-bottom: 1px solid var(--line); }
  .bar b { color: var(--title); white-space: nowrap; letter-spacing: .01em; }
  /* Title bar styles: fill (bar colour), flat (window colour), line (accent underline). */
  body.bar-flat .bar { background: transparent; }
  body.bar-line .bar { background: transparent; border-bottom: 2px solid var(--accent-line); }
  body.bar-line .bar b { color: var(--accent); }
  body.caps .bar b, body.caps .hub h3 { text-transform: uppercase; letter-spacing: .1em; font-size: .88em; }
  /* Fight state: a small chip after the title. */
  .bar .state { flex: 1; white-space: nowrap; overflow: hidden; color: var(--faint); font-size: 11px; }
  .bar .state.live { color: var(--good); }
  /* Developer mode: a plugin window's errors since its frame last loaded. */
  .bar .errs { color: var(--bad); font-size: 11px; font-weight: 600; }
  .bar .state.live::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 3px;
    background: var(--good); margin-right: 5px; vertical-align: 1px; }
  .tools { display: flex; justify-content: flex-end; gap: 2px; }
  button { background: var(--btn); color: var(--text); border: 1px solid transparent;
    border-radius: var(--rs); padding: 3px 9px; font: inherit; }
  button:hover { background: var(--btn-hi); }
  /* Window tools: quiet until hovered or on. */
  .tools button { background: transparent; color: var(--dim); padding: 1px 6px; font-size: 11px; height: 22px; }
  .tools button:hover { background: var(--raise-hi); color: var(--text); }
  .tools button.on { color: var(--accent); background: var(--accent-soft); }
  button.x { padding: 0 6px; display: inline-flex; align-items: center; }
  button.primary { background: var(--accent); color: var(--bg); font-weight: 600; }
  button.primary:hover { background: var(--accent-hi); }
  .ico { display: block; flex: none; }
  .wc .ico { align-self: flex-start; }

  /* ---- tables ---- */
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th { height: 22px; color: var(--faint); font-weight: 600; font-size: 10.5px; text-align: right;
    padding: 0 6px; white-space: nowrap; text-transform: uppercase; letter-spacing: .05em; }
  th:hover { color: var(--text); }
  th.sort { color: var(--accent); }
  th.l, td.l { text-align: left; }
  td { height: var(--rh); padding: 0 6px; text-align: right; white-space: nowrap; overflow: hidden;
    font-variant-numeric: tabular-nums; }
  tr.p td:first-child { color: var(--faint); font-size: 11px; }
  tr.p:hover td { background: var(--accent-soft); }
  tr.me td { color: var(--title); }
  tr.me td:first-child { color: var(--accent); }
  td.name { padding-left: 8px; border-left: 3px solid #888; }
  td.name img { width: 14px; height: 14px; vertical-align: -3px; margin-right: 5px; }
  .empty { padding: 22px 12px; color: var(--dim); text-align: center; }
  .foot { height: 22px; padding: 0 12px; color: var(--faint); display: flex; justify-content: space-between;
    border-top: 1px solid var(--line); font-size: 11px; align-items: center; }
  /* Compact (Settings): smaller rows, type and title bar; ui.js narrows the columns. */
  body.compact .win:not(.modal) { --rh: 16px; --bh: 22px; --fs: 10.5px; font-size: var(--fs); }
  body.compact .bar { padding: 0 4px 0 8px; gap: 6px; }
  body.compact .bar .state { font-size: 10px; }
  body.compact th { height: 16px; font-size: 9px; padding: 0 4px; }
  body.compact td { padding: 0 4px; }
  body.compact tr.p td:first-child { font-size: 9.5px; }
  body.compact td.name { padding-left: 5px; border-left-width: 2px; }
  body.compact td.name img { width: 11px; height: 11px; vertical-align: -2px; margin-right: 3px; }
  body.compact .foot { height: 16px; padding: 0 8px; font-size: 9.5px; }
  body.compact .empty { padding: 10px 8px; }
  .good { color: var(--good); } .bad { color: var(--bad); }

  /* ---- edit mode (Arrange): every window shows its outline and name ---- */
  .edit { display: none; position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 5;
    border: 2px dashed var(--accent); border-radius: var(--r); background: rgba(8,10,14,.8);
    align-items: center; justify-content: center; flex-direction: column; gap: 6px; }
  .edit b { color: var(--bg); background: var(--accent); font-size: 13px; padding: 3px 12px; border-radius: 12px; }
  .edit small { color: var(--text); font-size: 11px; }
  body.editing .win:not(.ed) .edit { display: flex; }
  body.editing .win.bare .edit b, body.editing .win.bare .edit small { display: none; }
  .lay { padding: 10px 14px 12px; }
  /* ---- merged windows: the members' tables in a grid, each member's bar its header ---- */
  .win.group > .bar { height: calc(var(--bh) * .75); }
  .win.group > .bar b { font-size: .92em; color: var(--dim); }
  .mgrid { display: grid; align-items: stretch; justify-items: stretch; }
  .mgrid > .win.cell { border: 0; border-radius: 0; box-shadow: inset 1px 1px 0 var(--line); }
  .mgrid > .win.cell .bar { background: transparent; }
  .mgrid > .ghost { border: 1px dashed var(--accent-line); background: var(--accent-soft); box-sizing: border-box; }
  .mgrid > .ghost.e-l { border-left: 2px solid var(--accent); }
  .mgrid > .ghost.e-r { border-right: 2px solid var(--accent); }
  .mgrid > .ghost.e-t { border-top: 2px solid var(--accent); }
  .mgrid > .ghost.e-b { border-bottom: 2px solid var(--accent); }
  .mgrid > .ghost[class*=" e-"] { animation: glow .9s infinite alternate; }
  @keyframes glow { from { box-shadow: 0 0 0 0 var(--accent-soft); } to { box-shadow: 0 0 10px 1px var(--accent-line); } }
  body.editing .win.group > .edit { bottom: auto; height: calc(var(--bh) * .75); flex-direction: row; }
  body.editing .win.group > .edit small { display: none; }
  body.editing .mgrid > .win.cell .edit { border-radius: 0; }
  .win.docking { opacity: .55; }
  .lay.banner { padding: 8px 12px 10px; }
  .lay .bn { display: flex; align-items: center; gap: 10px; }
  .lay .bn .bt { color: var(--accent); font-size: 14px; white-space: nowrap; }
  .lay .bn .bh { color: var(--dim); font-size: 12px; }
  .lay .bn .bh b { color: var(--text); }
  .lay .bn button { flex: none; }
  .lay .bn button.on { border-color: var(--accent-line); color: var(--accent); }
  .lay .more { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
  .lay .more .zl { border-top: 0; margin-top: 4px; }
  .win.jointarget { outline: 2px solid var(--good); outline-offset: 1px; }
  .mgrid > .ghost { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .ghost .joinhint { background: var(--bg); color: var(--good); border: 1px solid var(--good); border-radius: 10px;
    padding: 2px 10px; font-size: 12px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .lay p { margin: 0 0 10px; color: var(--dim); }
  .lay label { display: flex; align-items: center; gap: 10px; height: 26px; }
  .lay label small { color: var(--faint); margin-left: auto; font-variant-numeric: tabular-nums; }
  .lay .row { display: flex; gap: 6px; margin-top: 10px; justify-content: flex-end; }

  /* Toggle switch */
  .tog { width: 34px; height: 20px; border-radius: 10px; background: var(--line-hi); position: relative; flex: none; }
  .tog i { position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 8px; background: var(--dim); }
  .on > .tog, .tog.on { background: var(--accent); }
  .on > .tog i, .tog.on i { left: 16px; background: var(--bg); }

  /* ---- the axidps button: a bare glyph that sits with the game's own menu icons ---- */
  .win.bare { border: 0; background: transparent; border-radius: 0; }
  /* plugin windows: the hub's "Show title bar" off, and "Transparent background" on */
  .win.nobar .bar { display: none; }
  .win.nobar.trouble .bar { display: flex; }
  .win.clear { background: transparent; border-color: transparent; }
  .launch { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }

  /* ---- hub: a full window over the dimmed game ---- */
  .win.modal { border: var(--bw) solid var(--line-hi); border-radius: var(--r); background: var(--bg-modal); }
  .hub { width: 1040px; height: 680px; display: flex; flex-direction: column; font-size: 13.5px; }
  .hub .top { height: 52px; flex: none; display: flex; align-items: center; gap: 18px; padding: 0 14px 0 20px;
    background: var(--nav-modal); border-bottom: 1px solid var(--line); }
  .hub .top .x { background: transparent; color: var(--dim); height: 28px; }
  .hub .top .x:hover { background: var(--raise-hi); }
  .hub .top .grow { flex: 1; }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand b { font-size: 16px; color: var(--title); letter-spacing: .02em; }
  .hub nav { display: flex; gap: 4px; align-self: stretch; }
  .tabb { display: flex; align-items: center; gap: 8px; padding: 0 16px; color: var(--dim); font-weight: 500;
    border-bottom: 2px solid transparent; cursor: pointer; }
  .tabb:hover { color: var(--text); background: var(--raise-hi); }
  .tabb.on { color: var(--title); border-color: var(--accent); background: var(--accent-soft); }
  .tabb .n { font-size: 11px; line-height: 16px; padding: 0 7px; border-radius: 8px; color: var(--accent-hi);
    background: var(--accent-soft); border: 1px solid var(--accent-line); }
  .hub .top .kbd { color: var(--faint); font-size: 11.5px; }
  .hub main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .hub section { display: none; padding: 20px 28px 24px; overflow-y: auto; overflow-x: hidden; flex: 1; min-height: 0; }
  .hub section.on { display: block; }
  .hub section.wsec.on { display: flex; padding: 0; overflow: hidden; }
  /* Windows tab: the list (left), the selected window's settings and the bottom bar (right) */
  .wl { width: 290px; flex: none; border-right: 1px solid var(--line); background: var(--nav-modal); display: flex;
    flex-direction: column; min-height: 0; }
  .wl .lst { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 6px 10px 12px; }
  .wl h3 { margin: 4px 8px 8px; }
  .wl h3.gap { margin-top: 20px; }
  .wl .note { margin: 8px; color: var(--accent); font-size: 11.5px; }
  .w { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--rs); cursor: pointer; margin-bottom: 2px; }
  .w:hover { background: var(--raise-hi); }
  .w.on { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-line); }
  .w .ic { width: 30px; height: 24px; border-radius: 4px; border: 1px solid var(--line-hi); background: var(--bg); flex: none;
    display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 0 4px; box-sizing: border-box; }
  .w .ic i { display: block; height: 3px; border-radius: 1px; background: var(--dim); }
  .w.on .ic { border-color: var(--accent-line); }
  .w.on .ic i { background: var(--accent); }
  .w .nm { flex: 1; min-width: 0; }
  .w .nm b { display: block; color: var(--title); font-weight: 600; }
  .w .nm small { display: block; color: var(--dim); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .w.hid .nm b { color: var(--dim); font-weight: 400; }
  .w.hid .ic { border-style: dashed; }
  .w .show { padding: 4px 10px; font-size: 12px; color: var(--accent); background: transparent; border-color: var(--accent-line); }
  .w .show:disabled { pointer-events: auto; cursor: not-allowed; }
  .w.joined { margin-left: 22px; border-left: 2px solid var(--line-hi); padding-left: 8px; border-radius: 0 var(--rs) var(--rs) 0; }
  .wl .foot { flex: none; height: auto; padding: 12px; justify-content: flex-start; align-items: stretch; font-size: inherit; color: inherit; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  body.compact .wl .foot { height: auto; padding: 12px; font-size: inherit; }
  .wl .foot > button { width: 100%; padding: 9px 12px; }
  .wl .foot .addmenu { margin-top: 0; }
  .wl .foot .move { background: var(--raise-hi); border-color: var(--line-hi); display: flex; align-items: center;
    justify-content: center; gap: 8px; }
  .wl .foot button:disabled { pointer-events: auto; cursor: not-allowed; }
  .wr { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .ws { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .ws .head { flex: none; padding: 20px 24px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; gap: 10px; }
  .ws .head > div { flex: 1; min-width: 0; }
  .ws .head h2 { margin: 0; font-size: 18px; color: var(--title); overflow-wrap: anywhere; }
  .ws .head .sub { margin: 3px 0 0; color: var(--dim); }
  .ws .head button:disabled { pointer-events: auto; cursor: not-allowed; }
  .ws .grid { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 10px 18px 24px; }
  .ws .cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 34px; max-width: 760px; align-items: start; }
  .ws .grid .col { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); color: var(--text); }
  .ws .grid .note { color: var(--dim); margin: 14px 0 0; }
  .ws .grid > .opt:first-child { margin-bottom: 8px; }
  .ws .grid .pset { max-width: 560px; }
  .ws .grid .tbl.cw { max-width: 760px; margin-top: 14px; }
  .ws .grid .tbl.cw > .tbl-h { display: none; }
  .cw .cols2 .crow { grid-template-columns: 1fr; gap: 5px; padding: 8px 0; }
  .cw .crow > span { font-size: 12px; }
  .cw .crow .seg { flex-wrap: wrap; }
  .cw .clist { display: flex; flex-direction: column; gap: 4px; width: 100%; }
  .crw { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 6px; border: 1px solid var(--line);
    border-radius: var(--rs); background: var(--raise); }
  .crw .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .crw button { background: transparent; color: var(--dim); padding: 2px 7px; font-size: 12px; }
  .crw button:hover:not(:disabled) { color: var(--title); background: var(--raise-hi); }
  .crw .as { color: var(--accent); font-variant-numeric: tabular-nums; }
  .crw .grip { cursor: grab; touch-action: none; letter-spacing: -2px; padding: 2px 5px; }
  .crw .grip:focus-visible { outline: 1px solid var(--accent); }
  .clist.dragging, .clist.dragging .grip { cursor: grabbing; }
  .crw.drag { opacity: .55; }
  .crw.over { border-color: var(--accent); background: var(--accent-soft); }
  .cw .addcol { align-self: flex-start; padding: 4px 10px; font-size: 12px; }
  .cw .addcol.on { color: var(--accent); }
  .cw .plist { display: flex; flex-direction: column; width: 100%; max-height: 220px; overflow-y: auto; }
  .cw .pick button { width: 100%; text-align: left; padding: 6px 8px; font-size: 12px; background: transparent; color: var(--text); }
  .cw .pick button:hover:not(:disabled) { background: var(--raise-hi); color: var(--title); }
  .cw .pick.on button { color: var(--accent); }
  .cw .sortk button { padding: 3px 9px; font-size: 11px; }
  .cw .sortk button.on { color: var(--title); background: var(--btn-hi); }
  .cw .cr .note { margin: 4px 0 0; font-size: 12px; }
  .cw .cnote { padding: 2px 0; }
  .wr .bottom { flex: none; display: flex; gap: 8px; align-items: center; padding: 12px 24px; border-top: 1px solid var(--line);
    background: var(--nav-modal); }
  .wr .bottom .grow { flex: 1; }
  .wr .bottom small { color: var(--faint); }
  .optpage { max-width: 640px; }
  .opt .slide { flex: none; width: 220px; height: 20px; position: relative; margin-right: 6px; cursor: pointer; }
  .slide::before { content: ""; position: absolute; left: 0; right: 0; top: 8px; height: 4px; border-radius: 2px;
    background: var(--line-hi); }
  .slide em { position: absolute; left: 0; top: 8px; height: 4px; border-radius: 2px; background: var(--accent); }
  .slide i { position: absolute; top: 6px; width: 2px; height: 8px; margin-left: -1px; background: var(--faint); }
  .slide u { position: absolute; top: 2px; width: 16px; height: 16px; margin-left: -8px; border-radius: 8px;
    background: var(--title); border: 2px solid var(--accent); box-sizing: border-box; }
  .slide-n { width: 40px; text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); }
  .hub h3 { margin: 16px 0 8px; font-size: 11px; font-weight: 600; color: var(--faint); letter-spacing: .06em;
    text-transform: uppercase; }
  .hub h3:first-child { margin-top: 0; }
  /* Window cards */
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .wc { height: 92px; border: 1px solid var(--line); border-radius: var(--rs); background: var(--raise);
    padding: 12px; display: flex; flex-direction: column; position: relative; }
  .wc:hover { border-color: var(--line-hi); background: var(--raise-hi); }
  .wc.on { border-color: var(--accent-line); }
  .wc .tog { position: absolute; right: 12px; top: 12px; }
  .wc b { margin-top: auto; color: var(--title); }
  .wc small { color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; }
  .acts { display: flex; gap: 8px; margin-top: 14px; }
  .acts button { display: flex; align-items: center; gap: 7px; padding: 6px 12px; }
  /* Theme cards: each previews its own colours, font and shape. */
  .themes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .th { height: 78px; border: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; }
  .th:hover { border-color: var(--line-hi); }
  .th.on { box-shadow: 0 0 0 2px var(--accent); }
  .th .tb { height: 22px; display: flex; align-items: center; padding: 0 8px; font-size: 11px; font-weight: 600; }
  .th .rows { padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; }
  .th .rows i { height: 6px; display: block; }
  .look { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px 10px; align-items: center; }
  .look > span { color: var(--dim); }
  .seg { display: flex; gap: 2px; background: var(--raise); border: 1px solid var(--line); border-radius: var(--rs);
    padding: 2px; }
  .seg button { flex: 1; padding: 3px 0; font-size: 11px; color: var(--dim); background: transparent; }
  .seg button:hover { color: var(--text); background: var(--raise-hi); }
  .seg button.on { color: var(--title); background: var(--btn-hi); }
  .note { color: var(--faint); font-size: 11px; margin: 10px 0 0; }
  /* Settings rows */

  button.quiet { background: none; border-color: transparent; color: var(--dim); }
  button.quiet:hover { background: none; color: var(--text); border-color: var(--line-hi); }
  /* Wide, visible scroll bars everywhere in the hub: a track, and a thumb that is easy to grab. */
  .hub ::-webkit-scrollbar { width: 12px; height: 12px; }

    padding: 0 5px; line-height: 15px; white-space: nowrap; }

  .tbl { border: 1px solid var(--line); border-radius: var(--rs); background: var(--raise); padding: 8px 10px;

  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { display: inline-flex; align-items: center; gap: 2px; height: 22px; border-radius: var(--rs);

  .crow .seg button { flex: none; padding: 3px 9px; }

  .crow .lbl { color: var(--dim); font-size: 11px; margin-left: 12px; }

  .crow .step b { width: 34px; font-size: 12px; }

  .field { display: inline-block; min-width: 180px; padding: 3px 8px; border: 1px solid var(--line-hi);

  .bl.me .n { color: var(--title); }

  .big { padding: 12px 14px 14px; text-align: center; }
