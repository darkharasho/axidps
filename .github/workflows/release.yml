name: Release

# A v* tag builds the signed Windows installer and the Linux AppImage into a draft prerelease on
# darkharasho/axidps-releases and publishes it once every build is green and verified and the
# tagged commit passes ci.yml's tests (called from here as the `tests` job).
# workflow_dispatch (input `version`) builds everything into a draft named test-<run id> that is
# never published; delete it after checking.
# Jobs hand files to each other through the draft, not workflow artifacts, so the account's
# artifact storage quota (shared with every private repo) can't block a release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without a leading v (e.g. 0.0.0-ci.1). Builds only, never publishes.
        required: true
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  # The tag (v stripped in each job) or the dispatch input. The DLL's build.rs validates it as semver.
  AXIDPS_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  RELEASES_REPO: darkharasho/axidps-releases
  # Only a v* tag push publishes. A manual run is a test build even when started on a tag ref,
  # since its binaries carry the input's version, not the tag's.
  IS_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
  # Reruns keep the run id, so they reuse the same draft.
  RELEASE_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('test-{0}', github.run_id) }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check a release builds the tag's version
        if: env.IS_TAG == 'true'
        run: |
          if [ "${AXIDPS_VERSION#v}" != "${RELEASE_TAG#v}" ]; then
            echo "::error::Building version ${AXIDPS_VERSION#v} for release $RELEASE_TAG"
            exit 1
          fi

      - name: Create the draft prerelease (or reuse it on a rerun)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if draft="$(gh release view "$RELEASE_TAG" -R "$RELEASES_REPO" --json isDraft -q .isDraft 2>/dev/null)"; then
            [ "$draft" = true ] || { echo "::error::$RELEASE_TAG is already published"; exit 1; }
            echo "Reusing the draft $RELEASE_TAG"
            exit 0
          fi
          if [ "$IS_TAG" = true ]; then
            notes="Not yet checked in game on Windows."
          else
            notes="Test build of $GITHUB_REF_NAME at $GITHUB_SHA. Never published; delete it after checking."
          fi
          gh release create "$RELEASE_TAG" -R "$RELEASES_REPO" --draft --prerelease \
            --title "$RELEASE_TAG" --notes "$notes"

  # Builds the DLL from the private crates. The build output quotes private source, so it goes
  # to a file that is never printed or uploaded, and no target dir is cached (see ci.yml dll-check).
  dll:
    needs: prepare
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The game-facing crates live in the private repo darkharasho/axidps-internal, pinned in
      # .github/private-ref. Skipped while they are still in this repo (private/ already exists).
      - name: Pin the private crates
        id: pin
        run: echo "ref=$(cat .github/private-ref)" >> "$GITHUB_OUTPUT"

      - name: Fetch the private crates
        if: hashFiles('private/Cargo.toml') == ''
        uses: actions/checkout@v4
        with:
          repository: darkharasho/axidps-internal
          ref: ${{ steps.pin.outputs.ref }}
          path: private
          ssh-key: ${{ secrets.PRIVATE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Normalize the version
        run: echo "AXIDPS_VERSION=${AXIDPS_VERSION#v}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64

      # Registry and git sources only (public crates). Never cache a target dir that holds the
      # private crates: a fork's pull request can restore any cache saved on main.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-dll-${{ hashFiles('Cargo.lock', 'private/Cargo.lock') }}
          restore-keys: cargo-registry-dll-

      - run: tools/quiet-build "$RUNNER_TEMP/dll.log" -- cargo build --manifest-path private/Cargo.toml --release -p axidps-dll --target x86_64-pc-windows-gnu --features arcdps-chainload,overlay

      - name: Hand the DLL to the sign-dll job
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          cp private/target/x86_64-pc-windows-gnu/release/axidps_dll.dll dll-unsigned.dll
          gh release upload "$RELEASE_TAG" dll-unsigned.dll -R "$RELEASES_REPO" --clobber

  # Signs the DLL on its own, so the windows and linux builds can run side by side.
  sign-dll:
    needs: dll
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the unsigned DLL
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: gh release download "$RELEASE_TAG" -R "$RELEASES_REPO" -p dll-unsigned.dll -D dll

      - name: Sign the DLL
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          Move-Item dll/dll-unsigned.dll dll/dll-signed.dll
          ./packaging/windows/sign.ps1 -Files (Resolve-Path dll/dll-signed.dll).Path

      - name: Hand the signed DLL to the windows and linux jobs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: gh release upload "$RELEASE_TAG" dll/dll-signed.dll -R "$RELEASES_REPO" --clobber

  windows:
    needs: sign-dll
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize the version
        shell: bash
        run: echo "AXIDPS_VERSION=${AXIDPS_VERSION#v}" >> "$GITHUB_ENV"

      # Fail before the slow build instead of after it.
      - name: Check the Windows signing secrets are set
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          for v in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is not set (see docs/RELEASING.md)."; exit 1; }
          done

      - uses: dtolnay/rust-toolchain@stable

      # The overlay host pins its own toolchain (apps/axidps-overlay/rust-toolchain.toml).
      - name: Install the overlay host toolchain
        working-directory: apps/axidps-overlay
        run: rustup toolchain install

      # Servo's winget.json wants CMake, LLVM and Ninja (CMake and Ninja ship on the runner).
      # mozjs-sys also needs MozTools. Same setup as ci.yml overlay-check.
      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1"
          directory: ${{ runner.temp }}/llvm

      - shell: pwsh
        run: |
          echo "LIBCLANG_PATH=$(Join-Path $env:LLVM_PATH 'bin')" >> $env:GITHUB_ENV
          $dest = Join-Path $env:RUNNER_TEMP 'moztools'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Invoke-WebRequest "https://github.com/servo/servo-build-deps/releases/download/msvc-deps/moztools-4.0.zip" -OutFile "$dest\moztools.zip"
          Expand-Archive "$dest\moztools.zip" -DestinationPath $dest
          echo "MOZTOOLS_PATH=$dest\moztools-4.0" >> $env:GITHUB_ENV
          # Servo's checkout has test paths past MAX_PATH; libgit2 fails on them, git with longpaths does not.
          git config --system core.longpaths true
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> $env:GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            apps/axidps-overlay/target
          key: cargo-release-windows-${{ hashFiles('Cargo.lock', 'apps/axidps-overlay/Cargo.lock') }}
          restore-keys: cargo-release-windows-

      - name: Build the app and core
        run: cargo build --release -p axidps-app -p axidps-core

      - name: Build the overlay host
        working-directory: apps/axidps-overlay
        run: cargo build --release

      - name: Fetch the signed DLL
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: gh release download "$RELEASE_TAG" -R "$RELEASES_REPO" -p dll-signed.dll -D dll-signed

      - name: Stage the installed layout
        shell: bash
        run: |
          mkdir -p stage/overlay stage/game
          cp target/release/axidps.exe target/release/axidps-core.exe stage/
          cp apps/axidps-overlay/target/release/axidps-overlay.exe stage/overlay/
          cp dll-signed/dll-signed.dll stage/game/d3d11.dll
          npm install --no-audit --no-fund
          packaging/stage-page.sh stage/overlay/page "$AXIDPS_VERSION"

      - name: Sign the executables
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $files = @(
            (Resolve-Path stage/axidps.exe).Path,
            (Resolve-Path stage/axidps-core.exe).Path,
            (Resolve-Path stage/overlay/axidps-overlay.exe).Path
          )
          ./packaging/windows/sign.ps1 -Files $files

      # makensis is not part of the runner image, so install it. SIGN_PS1 makes it sign the
      # uninstaller as it is built (!uninstfinalize, NSIS >= 3.08), which needs the secrets here.
      - name: Build the installer
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          choco install nsis -y --no-progress
          $nsis = 'C:\Program Files (x86)\NSIS'
          New-Item -ItemType Directory -Force dist | Out-Null
          $sign = (Resolve-Path packaging/windows/sign.ps1).Path
          & "$nsis\makensis.exe" "-DVERSION=$env:AXIDPS_VERSION" "-DSTAGE=$((Resolve-Path stage).Path)" "-DOUTDIR=$((Resolve-Path dist).Path)" "-DSIGN_PS1=$sign" packaging/windows/axidps.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed ($LASTEXITCODE)" }

      - name: Sign the installer
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $setup = (Get-ChildItem dist -Filter '*-Setup.exe').FullName
          if (-not $setup) { throw 'No installer found in dist/' }
          ./packaging/windows/sign.ps1 -Files $setup

      # The release stays a draft (or is never made) if this fails, since draft needs this job.
      # uninstall.exe only exists once installed, so the installer is run silently into a temp
      # folder (no game here, so --install-game changes nothing; /LAUNCH=0 starts nothing).
      - name: Verify everything is signed
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -Filter '*-Setup.exe')
          if (-not $files) { Write-Error 'No installer found in dist/'; exit 1 }
          $files += Get-ChildItem stage -Recurse -Include *.exe, *.dll
          $dir = Join-Path $env:RUNNER_TEMP 'axidps-install-check'
          $p = Start-Process -FilePath $files[0].FullName -ArgumentList '/S', '/LAUNCH=0', "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "The silent install failed ($($p.ExitCode))"; exit 1 }
          $uninstaller = Get-Item (Join-Path $dir 'uninstall.exe') -ErrorAction SilentlyContinue
          if (-not $uninstaller) { Write-Error 'The install wrote no uninstall.exe'; exit 1 }
          $files += $uninstaller
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status)"
            if ($sig.Status -ne 'Valid') { Write-Error "$($f.Name) is not validly signed"; exit 1 }
          }

      - name: Upload the installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: gh release upload "$RELEASE_TAG" dist/axidps-*-Setup.exe -R "$RELEASES_REPO" --clobber

  # Pinned to Ubuntu 24.04, not ubuntu-latest: the programs need the glibc of the system they're
  # built on, and 24.04's 2.39 is the floor (SteamOS 3.7, Ubuntu 24.04, Debian 13). ubuntu-latest
  # became 26.04 (glibc 2.43) in 2026. appimage-check enforces the floor, so a LINUX_RUNNER with
  # a newer glibc fails the release instead of shipping an AppImage those systems can't start.
  linux:
    needs: sign-dll
    runs-on: ${{ vars.LINUX_RUNNER && fromJSON(vars.LINUX_RUNNER) || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      # A self-hosted runner keeps the workspace: keep the build folders, clear the rest.
      - run: git clean -ffdx -e /target -e /apps/axidps-overlay/target -e /node_modules

      - name: Normalize the version
        run: echo "AXIDPS_VERSION=${AXIDPS_VERSION#v}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install the overlay host toolchain
        working-directory: apps/axidps-overlay
        run: rustup toolchain install

      # Servo build deps: same list as ci.yml overlay-check.
      - if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates ccache clang cmake curl g++ git gperf \
            libdbus-1-dev libfreetype6-dev libgl1-mesa-dri libgles2-mesa-dev libglib2.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-ugly gstreamer1.0-plugins-base libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-libav libgstrtspserver-1.0-dev gstreamer1.0-tools libges-1.0-dev \
            libharfbuzz-dev liblzma-dev libudev-dev libunwind-dev libvulkan1 libx11-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxmu-dev libxmu6 \
            libegl1-mesa-dev llvm-dev m4 xorg-dev libxkbcommon0 libxkbcommon-x11-0 \
            libwayland-dev

      - uses: actions/cache@v4
        if: runner.environment == 'github-hosted'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            apps/axidps-overlay/target
          # The image is in the key: build scripts cached from a newer glibc won't run on an older one.
          key: cargo-release-linux-ubuntu24-${{ hashFiles('Cargo.lock', 'apps/axidps-overlay/Cargo.lock') }}
          restore-keys: cargo-release-linux-ubuntu24-

      - name: Build the app and core
        run: cargo build --release -p axidps-app -p axidps-core

      - name: Build the overlay host
        working-directory: apps/axidps-overlay
        run: cargo build --release

      - name: Fetch the signed DLL
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: gh release download "$RELEASE_TAG" -R "$RELEASES_REPO" -p dll-signed.dll -D dll-signed

      - name: Stage the installed layout
        run: |
          mkdir -p stage/overlay stage/game
          cp target/release/axidps target/release/axidps-core stage/
          cp apps/axidps-overlay/target/release/axidps-overlay stage/overlay/
          cp dll-signed/dll-signed.dll stage/game/d3d11.dll

      # The packaging script runs the tools with --appimage-extract-and-run, so FUSE is not needed.
      - name: Build the AppImage
        run: packaging/linux/build-appimage.sh "$AXIDPS_VERSION" stage out

      - name: Upload the AppImage
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: gh release upload "$RELEASE_TAG" out/axidps-*.AppImage -R "$RELEASES_REPO" --clobber

  # Every shared library the AppImage's programs link must be bundled or present on any desktop.
  # The build runner has every -dev package installed, so ldd there finds everything; this runs
  # ldd in a bare ubuntu:24.04 container instead, with only the libraries an AppImage may expect
  # from the system (the kind on AppImage's excludelist: GL/EGL, X11/xcb, Wayland, xkbcommon,
  # fontconfig/freetype, D-Bus). Libraries loaded with dlopen (GStreamer, the GL driver) are not
  # covered: ldd cannot see them. GitHub-hosted, for Docker, whatever runner built the AppImage.
  # It is also the glibc floor check: ubuntu:24.04 has glibc 2.39, so a program built against a
  # newer glibc fails here with "version `GLIBC_2.xx' not found".
  appimage-check:
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and extract the AppImage
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release download "$RELEASE_TAG" -R "$RELEASES_REPO" -p 'axidps-*.AppImage' -D appimage
          cd appimage
          appimage="$(ls axidps-*.AppImage)"
          chmod +x "$appimage"
          "./$appimage" --appimage-extract >/dev/null

      - name: Check its programs find their libraries on a plain system
        run: |
          docker run --rm -v "$PWD/appimage/squashfs-root:/app:ro" ubuntu:24.04 sh -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              libegl1 libgl1 libx11-6 libx11-xcb1 libxcb1 libxkbcommon0 libwayland-client0 \
              libwayland-egl1 libfontconfig1 libfreetype6 libdbus-1-3 >/dev/null
            status=0
            for b in /app/usr/bin/axidps /app/usr/bin/axidps-core /app/usr/bin/overlay/axidps-overlay; do
              echo "== $b"
              out="$(ldd "$b" 2>&1)" || status=1
              printf "%s\n" "$out"
              # ldd can exit 0 on a missing glibc version, so look for the message itself.
              missing="$(printf "%s\n" "$out" | grep "not found" || true)"
              if [ -n "$missing" ]; then
                status=1
                printf "%s\n" "$missing" | while IFS= read -r line; do
                  echo "::error title=AppImage library check::$b: $line"
                done
              fi
            done
            exit $status
          '

  # Runs for test builds too, so their draft matches what a tag would publish.
  finalize:
    needs: [windows, linux, appimage-check]
    runs-on: ubuntu-latest
    steps:
      - name: Add SHA256SUMS and drop the hand-off DLLs
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          mkdir release && cd release
          gh release download "$RELEASE_TAG" -R "$RELEASES_REPO" -p 'axidps-*-Setup.exe' -p 'axidps-*.AppImage'
          sha256sum axidps-*-Setup.exe axidps-*.AppImage > SHA256SUMS
          cat SHA256SUMS
          # Only those still there: a rerun after a later failure finds them gone.
          present="$(gh release view "$RELEASE_TAG" -R "$RELEASES_REPO" --json assets -q '.assets[].name')"
          for a in dll-unsigned.dll dll-signed.dll; do
            if grep -qxF "$a" <<<"$present"; then
              gh release delete-asset "$RELEASE_TAG" "$a" -R "$RELEASES_REPO" -y
            fi
          done
          gh release upload "$RELEASE_TAG" SHA256SUMS -R "$RELEASES_REPO" --clobber
          gh release view "$RELEASE_TAG" -R "$RELEASES_REPO" --json assets -q '.assets[].name'

  # The tagged commit's tests (ci.yml's jobs). Builds run alongside; only publishing waits.
  tests:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  # Needs the tests too: a tag whose tests fail leaves its draft unpublished.
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [finalize, tests]
    runs-on: ubuntu-latest
    steps:
      # The asset names carry the version the binaries were built with (AXIDPS_VERSION). A
      # release whose binaries say another version would make every launcher update forever.
      - name: Check the built version is the tag's
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          version="${RELEASE_TAG#v}"
          assets="$(gh release view "$RELEASE_TAG" -R "$RELEASES_REPO" --json assets -q '.assets[].name')"
          echo "$assets"
          for want in "axidps-$version-Setup.exe" "axidps-$version.AppImage" SHA256SUMS; do
            grep -qxF "$want" <<<"$assets" || { echo "::error::$RELEASE_TAG has no $want"; exit 1; }
          done
          if grep -v -x -F -e "axidps-$version-Setup.exe" -e "axidps-$version.AppImage" -e SHA256SUMS <<<"$assets"; then
            echo "::error::$RELEASE_TAG has assets of another version (listed above)"
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: gh release edit "$RELEASE_TAG" -R "$RELEASES_REPO" --draft=false
